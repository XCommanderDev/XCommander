<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Menu-bar mark proposal — one nib, drawn flat for the 18pt template box.
  KEPT FOR REFERENCE, NOT RECOMMENDED. See the note at the bottom.

  Geometry: near-flat shoulders and straight converging sides, because the first version
  (round dome + round hole) rendered as a map pin at every size. Breather hole is small
  and high; the slit tapers to a solid tip.

  Why it is not recommended: at 18pt a filled silhouette loses its interior first, so the
  hole and slit merge into a grey smear and what is left is a dark triangle. The existing
  three-pen A survives the same downsample better, because a skeletal letterform keeps its
  structure when a solid shape keeps only its outline. Apple's own menu-bar glyphs are
  stroke skeletons for this reason.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     version="1.1" id="menubar-nib">
  <g id="nib">
    <!-- one path, three subpaths: body, breather hole, slit. evenodd knocks the last two out -->
    <path fill="#000000" fill-rule="evenodd"
          d="M 512,150
             C 690,150 812,196 812,268
             C 812,344 758,472 688,602
             C 618,732 550,860 512,966
             C 474,860 406,732 336,602
             C 266,472 212,344 212,268
             C 212,196 334,150 512,150
             Z
             M 512,268
             a 62,62 0 1,0 0,124
             a 62,62 0 1,0 0,-124
             Z
             M 488,404
             L 536,404
             L 520,912
             L 504,912
             Z" />
  </g>
</svg>
