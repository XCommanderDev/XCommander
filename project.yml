# The Xcode project is generated from this file by XcodeGen:
#
#   brew install xcodegen
#   xcodegen
#
# Edit this file, not XCommander.xcodeproj, then regenerate. The generated project is
# committed so the repo opens in Xcode without installing anything.
name: XCommander
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  XCommanderCore:
    path: .
  # In-app updates. Only the Xcode-built app links it: `xcdev` builds with SwiftPM and
  # leaves it out, so a build from source never tries to replace itself.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
targets:
  XCommander:
    type: application
    platform: macOS
    # A shared scheme, committed with the project, so command-line builds and CI can use it.
    scheme: {}
    # DEVELOPMENT_TEAM and BUNDLE_ID_PREFIX come from here. To sign with your own
    # account, create Config/Signing.local.xcconfig (see the comments in Signing.xcconfig).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Sources/Companion
        excludes:
          - "XCommanderAppIcon.icon/**"
      # Declared as a single file, not scanned as a group: otherwise XcodeGen adds the
      # document's icon.json and layer individually, they are copied into Resources as loose
      # files, and actool never compiles the icon.
      - path: Sources/Companion/XCommanderAppIcon.icon
        type: file
    dependencies:
      - package: XCommanderCore
        product: XCommanderCore
      - package: XCommanderCore
        product: CIndexStore
      - package: XCommanderCore
        product: CSourceKit
      # The AX menu walk, shared with the `xcmdr` maintenance tool.
      - package: XCommanderCore
        product: XcodeMenus
      - package: Sparkle
    info:
      path: Sources/Companion/Info.plist
      properties:
        CFBundleName: XCommander
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Wassim Mansouri. Licensed under GPLv3."
        # A menu-bar app: no Dock icon, no app switcher entry.
        LSUIElement: true
        # Sparkle. The feed is on xcommander.dev, which redirects to the copy GitHub Pages
        # serves, so it can move later without stranding anyone. Updates must be signed with
        # the private half of this key (kept in the maintainer's keychain and in the release
        # environment's secrets). Automatic checks are on: the first-run window says so.
        SUFeedURL: https://xcommander.dev/appcast.xml
        SUPublicEDKey: HvdG3cQ42Ug2N00RGmfN8lfinUioZK6a2YW0bZuNK7A=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).XCommander
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # The Icon Composer document, not an asset catalogue AppIcon: macOS 26 draws it with
        # the layered treatment, and actool builds older sizes from the same file.
        ASSETCATALOG_COMPILER_APPICON_NAME: XCommanderAppIcon
