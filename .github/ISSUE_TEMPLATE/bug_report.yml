name: Bug report
description: Something in XCommander doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. XCommander is early and not stable yet, so reports like this are how it gets better.

        **Tip:** "Report a Bug…" in XCommander's menu bar menu opens this form with the versions below already filled in.

  - type: input
    id: xcommander
    attributes:
      label: XCommander version
      description: Shown under the status line in XCommander's menu bar menu.
      placeholder: "0.1.0-alpha.1 build 42"
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode version and build
      description: Xcode → About Xcode.
      placeholder: "27.2 (27B51)"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.6"
    validations:
      required: true

  - type: input
    id: keyboard
    attributes:
      label: Keyboard layout
      description: Bindings follow the character a key produces, so the layout matters.
      placeholder: "U.S., French, German…"

  - type: dropdown
    id: install
    attributes:
      label: How you're running it
      options:
        - A release from GitHub
        - Built from source with Xcode
        - Built from source with swift run xcdev
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The keys you pressed, what you expected, and what happened instead.
      placeholder: |
        I pressed ⌥RET w q with two editor panes open.
        I expected the focused pane to close. Nothing happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Starting from Xcode with a project open, if you can.
      placeholder: |
        1. Open a Swift file
        2. ⌥RET w v to split
        3. ⌥RET w q

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Run this in Terminal right after it happens, and paste the output:
        `log show --last 5m --predicate 'subsystem == "dev.xcommander.XCommander"'`
        If you build from source, the output of `swift run xcmdr doctor` helps a lot too.
      render: text
