# Publishes Sparkle's update feed, appcast.xml, with GitHub Pages.
#
# Runs when a release is published, edited, unpublished or deleted, so the feed always lists
# exactly the published releases. Drafts never appear in it: a release reaches people's Macs
# only after it has been checked and published by hand. Pulling a bad release (unpublish or
# delete it) takes it out of the feed the same way.
#
# The app reads https://xcommander.dev/appcast.xml, which redirects here. Keeping our own
# domain in the app means the feed can move without stranding anyone on an old build.
name: Appcast

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appcast
  cancel-in-progress: true

jobs:
  appcast:
    runs-on: xcode-27
    steps:
      # The generator comes from main, whichever release triggered the run.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Write the appcast
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          swift run xcdev appcast site/appcast.xml
          # Anyone opening the Pages address in a browser lands on the website.
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=https://xcommander.dev">' \
            > site/index.html

      # Pages serves the gh-pages branch. Each run replaces it with a single new commit, so the
      # branch never grows and every run is published. (Deploying with actions/deploy-pages
      # instead names each deployment after the commit and skips names it has seen, so a
      # release edited or pulled later would never leave the feed.)
      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Update the appcast from ${GITHUB_EVENT_NAME} ${GITHUB_REF_NAME}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published. Pages serves it within a minute or two:"
          echo "https://xcommanderdev.github.io/XCommander/appcast.xml"
