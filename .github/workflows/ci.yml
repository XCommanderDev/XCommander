# Runs the tests and builds the app on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 27 lives on its own runner image (in preview as of November 2026).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      # The image's default Xcode is its newest stable one (newer ones there can be release
      # candidates). XCommander needs Xcode 27 or later, so stop early if that ever changes.
      - name: Check Xcode
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')
          if [ "$MAJOR" -lt 27 ]; then
            echo "::error::XCommander needs Xcode 27 or later, this runner has $MAJOR."
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build the app
        run: |
          xcodebuild -project XCommander.xcodeproj -scheme XCommander \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO build
